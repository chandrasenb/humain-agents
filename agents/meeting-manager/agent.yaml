name: meeting-manager
version: "2.6.31"
description: >
  Reads and schedules Google Calendar events on the user's behalf, with
  conflict detection and alternative-slot suggestions. Requires the user to
  have connected a Google account via the Connectors hub (HUMAIN-2060).
  Reachable either as structured tool calls or as natural-language chat
  (the `router` entry node).

# Marketplace-owned deployment block (backend/models/agent_manifest.py
# DeploymentBlock). `runtime` must be exactly "python" (not "python3.11") —
# the manifest schema only accepts python | node:20 | java:21.
deployment:
  runtime: python
  source_commit: "494586d9dc0d7ab6af69208c5aa62fed28106a0d"
  source_repo: "https://github.com/chandrasenb/humain-agents"
  resources:
    cpu: 1
    memory: 1Gi
  # `openai-api-key` / `openai-base-url` are existing Secret Manager entry
  # names (same names agentic-invoice-processing/agent.yaml declares) — the
  # platform injects them as OPENAI_API_KEY / OPENAI_BASE_URL, which
  # src/main.py's /chat endpoint reads to call NVIDIA NIM's OpenAI-
  # compatible API for intent routing. No other secrets: the Google OAuth
  # token is injected directly as GOOGLE_ACCESS_TOKEN / GOOGLE_ACCOUNT_EMAIL
  # by the Connectors hub's provision gate (specs/028-user-integrations-
  # connectors), not read from `secrets:`.
  secrets:
    - openai-api-key
    - openai-base-url
    - openai-model-id
  # HUMAIN-2060 (FR-008/FR-009): the provision gate refuses to launch this
  # agent with `connector_required` unless the launching user has a
  # connected Google account.
  connectors:
    - provider: google
  # 032-shared-agent-memory: opts this agent into the platform proxy's
  # memory hooks (backend/routes/h2oo_proxy.py) — manifest-only change, no
  # source code in this repo is touched. The proxy retrieves matching
  # memories before forwarding an invocation (injected as `memory_context`)
  # and extracts+stores new ones after the response completes.
  memory:
    enabled: true
    retrieval_query: "user travel plans and preferences"

# H2O-O v0.2 graph (docs/ADDING_AGENTS.md §3). NOTE: as of this writing the
# HUMAIN marketplace backend does not auto-wire a manifest's nodes/edges to
# a marketplace-deployed agent's own HTTP container (confirmed against
# backend/services/manifest_validator.py and backend/services/
# h2oo_run_adapter.py — there is no tool_call/llm → HTTP bridge for agents
# like this one). This graph documents the intended flow and is what would
# be registered with the H2O-O substrate directly (see ADDING_AGENTS.md
# §11); today the deployed container's own /chat route (src/main.py) does
# this exact routing itself, in Python, independent of this file.
entry: router

nodes:
  # LLM entry point (ADDING_AGENTS.md §3.1 `llm` node): parses the user's
  # natural-language message and decides which one tool to call. Same model
  # agentic-invoice-processing/agent.yaml declares for its own `llm` node.
  # src/main.py's actual call reaches it via the openai SDK pointed at
  # OPENAI_BASE_URL (NVIDIA NIM's OpenAI-compatible endpoint) — the two
  # aren't wired together yet, see the note above.
  - name: router
    type: llm
    options:
      model: nvidia/nemotron-3-ultra-550b-a55b
      system_prompt: >
        You are the Meeting Manager assistant. You help the user view their
        Google Calendar and schedule meetings, with conflict detection.
        Call a tool when appropriate: fetch_calendar_events to look up events
        for a described time range (e.g. "today", "this week", "next Friday");
        conflict_check to test whether a specific proposed time is free
        without scheduling anything; or schedule_meeting to book a new meeting
        when the user wants to schedule something and has given at least a
        time — if they omit a title (e.g. "schedule something at 3pm today"),
        still call schedule_meeting with a sensible default title such as
        "Meeting". Do NOT call a tool for greetings/small talk (reply
        conversationally) or for cancel/delete/modify requests (politely
        decline — no tool exists for those). Pass the user's time phrase
        straight through as the query/when argument — do not convert it to a
        date yourself, the tool does that. Default duration_minutes to 30 if
        unspecified. Only include attendees the user explicitly named as email
        addresses.
      tools: [fetch_calendar_events, conflict_check, schedule_meeting]

  - name: fetch_calendar_events
    type: tool_call
    inputs:
      tool: fetch_calendar_events
      args:
        query: "this week"

  - name: conflict_check
    type: tool_call
    inputs:
      tool: conflict_check
      args: {}

  - name: schedule_meeting
    type: tool_call
    inputs:
      tool: schedule_meeting
      args: {}

  # Deterministic (not a second LLM call — see README "Why format_response
  # isn't an LLM call"): turns a tool's structured JSON result into a short
  # natural-language reply via a template per result shape.
  - name: format_response
    type: transform
    inputs:
      result: "$.output"

edges:
  - from: router
    to: fetch_calendar_events
    when: "$.tool == fetch_calendar_events"
  - from: router
    to: conflict_check
    when: "$.tool == conflict_check"
  - from: router
    to: schedule_meeting
    when: "$.tool == schedule_meeting"
  - from: fetch_calendar_events
    to: format_response
  - from: conflict_check
    to: format_response
  - from: schedule_meeting
    to: format_response
